<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Theme and palette, applied before paint; see theme.js. The colour tokens
       come from appearance.css (generated), the foundation rules from
       elefant-ui.css — both before this page's own <style>, which refines them. -->
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/appearance.css">
  <link rel="stylesheet" href="/elefant-ui.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="elefant_transparent.png" type="image/png">
  <title>Change password — <!-- APP_NAME --></title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family: var(--font-sans); background:var(--bg); color:var(--text);
           min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius: var(--radius);
            width:100%; max-width:420px; padding:2rem;
      box-shadow: var(--shadow);
    }
    h1 { font-size: 22px; text-align:center; margin-bottom:0.25rem; letter-spacing: -0.02em; }
    .subtitle { text-align:center; color:var(--muted); font-size:0.875rem; margin-bottom:1.25rem; }
    .field { margin-bottom:1rem; }
    label { display:block; font-size:0.875rem; color:var(--muted); margin-bottom:0.375rem; }
    input { width:100%; padding:0.5rem 0.75rem; border: 1px solid var(--line);
            border-radius:var(--radius-sm); background:var(--field); color:var(--text);
            font-size:0.875rem; outline:none; }
    input:focus { border-color:var(--accent); box-shadow: 0 0 0 3px var(--accentbg); }
    .error { color:var(--danger); font-size:0.8125rem; margin-bottom:1rem; padding:0.5rem 0.75rem;
             background:var(--dangerbg); border:1px solid var(--dangerline); border-radius:var(--radius-xs); display:none; }
    .error:not(:empty) { display:block; }
    .forced-banner { color:var(--warning); font-size:0.8125rem; margin-bottom:1rem; padding:0.5rem 0.75rem;
                     background:var(--warningbg); border:1px solid var(--warningline); border-radius:var(--radius-xs);
                     display:none; line-height:1.4; }
    .forced-banner.show { display:block; }
    .btn { width:100%; padding:0.625rem 1rem; background:var(--accent); color:var(--on-accent); border:none;
           border-radius:var(--radius-sm); font-weight: 550; cursor:pointer; }
    .btn:hover { background:var(--accent-hover); }
    .you { color:var(--text); font-weight:600; }
  </style>
</head>
<body>
<div class="card">
  <h1>Change password</h1>
  <p class="subtitle">Signed in as <span class="you" id="who"><!-- USERNAME --></span></p>
  <div id="forced-banner" class="forced-banner">
    Your administrator set a one-time password for this account. Please choose a new password to continue.
  </div>
  <p class="error"><!-- ERROR --></p>
  <form method="POST" action="/change-password">
    <input type="hidden" name="next" value="<!-- NEXT -->">
    <div class="field">
      <label for="current_password">Current password</label>
      <input type="password" id="current_password" name="current_password" autocomplete="current-password" required>
    </div>
    <div class="field">
      <label for="new_password">New password (8+ characters)</label>
      <input type="password" id="new_password" name="new_password" autocomplete="new-password" required minlength="8" autofocus>
    </div>
    <div class="field">
      <label for="confirm_password">Confirm new password</label>
      <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" required minlength="8">
    </div>
    <button type="submit" class="btn">Change password</button>
  </form>
</div>
<script>
  // The FORCED placeholder is replaced server-side with "true" when the user
  // has must_change_password=True; we surface a contextual banner so they
  // understand why they're seeing this page.
  (function() {
    var forced = "<!-- FORCED -->".trim();
    if (forced === 'true') {
      document.getElementById('forced-banner').classList.add('show');
    }
  })();
</script>
</body>
</html>
