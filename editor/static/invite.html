<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Theme and palette, applied before paint; see theme.js. The colour tokens
       come from appearance.css (generated), the foundation rules from
       elefant-ui.css — both before this page's own <style>, which refines them. -->
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/appearance.css">
  <link rel="stylesheet" href="/elefant-ui.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="elefant_transparent.png" type="image/png">
  <title>Accept invite — <!-- APP_NAME --></title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family: var(--font-sans); background:var(--bg); color:var(--text);
           min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius: var(--radius);
            width:100%; max-width:400px; padding:2rem;
      box-shadow: var(--shadow);
    }
    h1 { font-size: 22px; text-align:center; margin-bottom:0.25rem; letter-spacing: -0.02em; }
    .subtitle { text-align:center; color:var(--muted); font-size:0.875rem; margin-bottom:1.25rem; }
    .field { margin-bottom:1rem; }
    label { display:block; font-size:0.875rem; color:var(--muted); margin-bottom:0.375rem; }
    input { width:100%; padding:0.5rem 0.75rem; border: 1px solid var(--line);
            border-radius:var(--radius-sm); background:var(--field); color:var(--text);
            font-size:0.875rem; outline:none; }
    input:focus { border-color:var(--accent); box-shadow: 0 0 0 3px var(--accentbg); }
    input[readonly] { color:var(--muted); cursor:not-allowed; }
    .badge { display:inline-block; padding:0.125rem 0.5rem; background:var(--accentbg);
             color:var(--accent); border-radius:999px; font-size:0.75rem; font-weight:600;
             text-transform:uppercase; letter-spacing:0.05em; margin-left:0.25rem; }
    .error { color:var(--danger); font-size:0.8125rem; margin-bottom:1rem; padding:0.5rem 0.75rem;
             background:var(--dangerbg); border:1px solid var(--dangerline); border-radius:var(--radius-xs); display:none; }
    .error:not(:empty) { display:block; }
    .btn { width:100%; padding:0.625rem 1rem; background:var(--accent); color:var(--on-accent); border:none;
           border-radius:var(--radius-sm); font-weight: 550; cursor:pointer; }
    .btn:hover { background:var(--accent-hover); }
    .username-banner { background:var(--accentbg); border:1px solid var(--accentline);
                       border-radius:var(--radius-xs); padding:0.5rem 0.75rem; font-size:0.8125rem;
                       margin-bottom:1rem; color:var(--text); word-break:break-all; }
    .username-banner strong { color:var(--accent); }
  </style>
</head>
<body>
<div class="card">
  <h1>You're invited</h1>
  <p class="subtitle">
    Joining <strong><!-- ORG_NAME --></strong>
    <span class="badge"><!-- ROLE --></span>
  </p>
  <p class="error"><!-- ERROR --></p>
  <form method="POST" action="/invite/<!-- INVITE_ID -->">
    <!-- If admin pre-created the account, full username is fixed -->
    <div id="precreated-banner" class="username-banner" style="display:none">
      You're signing in as <strong id="precreated-username"><!-- FULL_USERNAME --></strong>
    </div>

    <div class="field">
      <label for="code">Invite code</label>
      <input type="text" id="code" name="code" required autofocus
             style="text-transform:uppercase;letter-spacing:0.2em;text-align:center">
    </div>

    <!-- Legacy flow: only shown when admin did NOT pre-create the account -->
    <div class="field" id="username-field">
      <label for="username">Username
        <span style="color:var(--muted);font-weight:400">(we'll add your org's domain)</span>
      </label>
      <input type="text" id="username" name="username" autocomplete="username"
             data-org-domain="<!-- ORG_DOMAIN -->"
             title="Type just the local part — your org's domain is appended automatically">
      <div id="username-hint" style="display:none;color:var(--danger);font-size:0.75rem;margin-top:0.25rem">
        The domain you typed doesn't match this organization's domain.
        Use <code id="username-hint-local">your-name</code> instead — we'll add <code id="username-hint-domain">@example.com</code> automatically.
      </div>
    </div>

    <div class="field">
      <label for="display_name">Display name (optional)</label>
      <input type="text" id="display_name" name="display_name" autocomplete="name">
    </div>
    <div class="field">
      <label for="password">Password (8+ characters)</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
    </div>
    <button type="submit" class="btn">Create account</button>
  </form>
</div>
<script>
  (function() {
    // Pre-created account path — admin already set the username
    const banner = document.getElementById('precreated-banner');
    const bannerName = document.getElementById('precreated-username');
    const usernameField = document.getElementById('username-field');
    const usernameInput = document.getElementById('username');

    // The placeholder gets literally replaced by the server. When no
    // pre-created user is linked to this invite, the placeholder string is
    // left empty.
    const fullUsername = (bannerName && bannerName.textContent || '').trim();
    if (fullUsername) {
      banner.style.display = 'block';
      usernameField.style.display = 'none';
      usernameInput.removeAttribute('required');
      usernameInput.value = '';
      return; // no domain normalisation needed
    }

    // Legacy flow: normalise username with org-domain autofill.
    if (!usernameInput) return;
    usernameInput.setAttribute('required', 'required');

    const hint   = document.getElementById('username-hint');
    const local  = document.getElementById('username-hint-local');
    const domEl  = document.getElementById('username-hint-domain');
    const orgDomain = (usernameInput.dataset.orgDomain || '').trim().toLowerCase();
    if (domEl) domEl.textContent = orgDomain ? '@' + orgDomain : '';

    function normalize() {
      let v = usernameInput.value.trim().toLowerCase();
      if (!v) { hint.style.display = 'none'; return; }
      const at = v.indexOf('@');
      if (at < 0) {
        if (orgDomain) usernameInput.value = v + '@' + orgDomain;
        hint.style.display = 'none';
        return;
      }
      const localPart = v.slice(0, at);
      const dom       = v.slice(at + 1);
      if (!orgDomain || dom === orgDomain) {
        usernameInput.value = v;
        hint.style.display = 'none';
      } else {
        if (local) local.textContent = localPart || 'your-name';
        usernameInput.value = localPart + (orgDomain ? '@' + orgDomain : '');
        hint.style.display = 'block';
      }
    }
    usernameInput.addEventListener('blur', normalize);
    usernameInput.form && usernameInput.form.addEventListener('submit', normalize);
  })();
</script>
</body>
</html>
