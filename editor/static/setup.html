<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Theme and palette, applied before paint; see theme.js. The colour tokens
       come from appearance.css (generated), the foundation rules from
       elefant-ui.css — both before this page's own <style>, which refines them. -->
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/appearance.css">
  <link rel="stylesheet" href="/elefant-ui.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="elefant_transparent.png" type="image/png">
  <meta property="og:title" content="Elefant — Knowledge Base & Memory">
  <meta property="og:description" content="Self-hostable wiki + AI memory store with MCP integration.">
  <meta property="og:type" content="website">
  <title>Set Up — <!-- APP_NAME --></title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }


    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      width: 100%;
      max-width: 380px;
      padding: 2rem;
      box-shadow: var(--shadow);
    }

    .logo { text-align: center; margin-bottom: 1.5rem; }
    .logo svg { width: 48px; height: 48px; }

    h1 {
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 0.25rem;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }

    .note {
      font-size: 0.8125rem;
      color: var(--muted);
      background: var(--accentbg);
      border: 1px solid var(--accentline);
      border-radius: var(--radius-xs);
      padding: 0.625rem 0.75rem;
      margin-bottom: 1.25rem;
      line-height: 1.5;
    }

    .field { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.375rem;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background:var(--field);
      color: var(--text);
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accentbg);
    }
    input::placeholder { color: var(--muted); opacity: 0.6; }

    .error {
      color: var(--danger);
      font-size: 0.8125rem;
      margin-bottom: 1rem;
      padding: 0.5rem 0.75rem;
      background: var(--dangerbg);
      border: 1px solid var(--dangerline);
      border-radius: var(--radius-xs);
      display: none;
    }
    .error:not(:empty) { display: block; }

    .btn {
      width: 100%;
      padding: 0.625rem 1rem;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 550;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .btn:hover {
      background: var(--accent-hover);
    }

    .pw-hint {
      color: var(--muted);
      font-weight: 400;
    }

    @media (max-width: 480px) {
      .card { padding: 1.5rem 1.25rem; border-radius: var(--radius); box-shadow: var(--shadow); }
      input[type="text"], input[type="password"] { font-size: 16px; } /* prevent iOS zoom */
      .btn { min-height: 44px; font-size: 1rem; }
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <img src="elefant_transparent.png" alt="Elefant" style="width: 56px; height: 56px;">
  </div>
  <h1>Set Up <!-- APP_NAME --></h1>
  <p class="subtitle">Create the first <!-- ROLE_LABEL --></p>
  <p class="note">This is the highest-privilege account on this deployment. It can only be created once via this form.</p>
  <p class="error" id="error-msg"><!-- ERROR --></p>
  <form method="POST" action="">
    <div class="field">
      <label for="username">Username
        <span class="pw-hint" id="username-suffix-hint">(local part only)</span>
      </label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required
             data-org-domain="<!-- ORG_DOMAIN -->"
             title="Type just the local part — your org's domain is appended automatically">
      <div id="username-hint" style="display:none;color:var(--danger);font-size:0.75rem;margin-top:0.25rem">
        The domain you typed doesn't match.
        Use <code id="username-hint-local">your-name</code> instead — we'll add <code id="username-hint-domain">@example.com</code> automatically.
      </div>
    </div>
    <div class="field">
      <label for="password">Password <span class="pw-hint">(min. 8 characters)</span></label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
    </div>
    <button type="submit" class="btn">Create Account</button>
  </form>
</div>
<script>
  // Same autofill logic as invite.html: append @<org-domain> on blur so
  // password managers capture the canonical login.  No-op when ORG_DOMAIN
  // is empty (multi-org first-run platform_admin has no domain).
  (function() {
    const input  = document.getElementById('username');
    const hint   = document.getElementById('username-hint');
    const local  = document.getElementById('username-hint-local');
    const domEl  = document.getElementById('username-hint-domain');
    const suffix = document.getElementById('username-suffix-hint');
    if (!input) return;
    const orgDomain = (input.dataset.orgDomain || '').trim().toLowerCase();
    if (domEl)  domEl.textContent  = orgDomain ? '@' + orgDomain : '';
    if (suffix) suffix.textContent = orgDomain
        ? "(we'll add @" + orgDomain + ")"
        : '(no @ — just the local part)';

    function normalize() {
      let v = input.value.trim().toLowerCase();
      if (!v) { hint.style.display = 'none'; return; }
      const at = v.indexOf('@');
      if (at < 0) {
        if (orgDomain) input.value = v + '@' + orgDomain;
        hint.style.display = 'none';
        return;
      }
      const localPart = v.slice(0, at);
      const dom       = v.slice(at + 1);
      if (!orgDomain) {
        // Platform-admin (multi-org first-run): there's no org domain at all
        // — drop any '@…' the user typed.
        input.value = localPart;
        hint.style.display = 'none';
        return;
      }
      if (dom === orgDomain) {
        input.value = v;
        hint.style.display = 'none';
      } else {
        if (local) local.textContent = localPart || 'your-name';
        input.value = localPart + '@' + orgDomain;
        hint.style.display = 'block';
      }
    }
    input.addEventListener('blur', normalize);
    input.form && input.form.addEventListener('submit', normalize);
  })();
</script>
</body>
</html>
