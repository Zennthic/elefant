<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Theme and palette, applied before paint; see theme.js. The colour tokens
       come from appearance.css (generated), the foundation rules from
       elefant-ui.css — both before this page's own <style>, which refines them. -->
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/appearance.css">
  <link rel="stylesheet" href="/elefant-ui.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="elefant_transparent.png" type="image/png">
  <meta property="og:title" content="Elefant — Knowledge Base & Memory">
  <meta property="og:description" content="Self-hostable wiki + AI memory store with MCP integration.">
  <meta property="og:type" content="website">
  <title>Sign In — <!-- APP_NAME --></title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }


    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      width: 100%;
      max-width: 360px;
      padding: 2rem;
      box-shadow: var(--shadow);
    }



    h1 {
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      margin-bottom: 0.25rem;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.875rem;
      margin-bottom: 1.5rem;
    }

    .field { margin-bottom: 1rem; }

    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 0.375rem;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      background:var(--field);
      color: var(--text);
      font-size: 0.875rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accentbg);
    }
    input::placeholder { color: var(--muted); opacity: 0.6; }

    .error {
      color: var(--danger);
      font-size: 0.8125rem;
      margin-bottom: 1rem;
      padding: 0.5rem 0.75rem;
      background: var(--dangerbg);
      border: 1px solid var(--dangerline);
      border-radius: var(--radius-xs);
      display: none;
    }
    .error:not(:empty) { display: block; }

    .btn {
      width: 100%;
      padding: 0.625rem 1rem;
      background: var(--accent);
      color: var(--on-accent);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.875rem;
      font-weight: 550;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .btn:hover {
      background: var(--accent-hover);
    }

    .setup-link {
      text-align: center;
      margin-top: 1rem;
      font-size: 0.8125rem;
      color: var(--muted);
    }
    .setup-link a { color: var(--accent); text-decoration: none; }
    .setup-link a:hover { text-decoration: underline; }

    @media (max-width: 480px) {
      .card { padding: 1.5rem 1.25rem; border-radius: var(--radius); box-shadow: var(--shadow); }
      input[type="text"], input[type="password"] { font-size: 16px; } /* prevent iOS zoom */
      .btn { min-height: 44px; font-size: 1rem; }
    }
  </style>
</head>
<body>
<div class="card">
  <h1><!-- APP_NAME --></h1>
  <p class="subtitle">Sign in to continue</p>
  <p class="error" id="error-msg"><!-- ERROR --></p>
  <form method="POST" action="">
    <input type="hidden" name="next" id="next-field" value="<!-- NEXT -->">
    <div class="field">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" autofocus required>
    </div>
    <div class="field">
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">Sign In</button>
  </form>
  <p class="setup-link">
    First time? <a href="/setup">Set up your account</a>
  </p>
</div>
</body>
</html>
