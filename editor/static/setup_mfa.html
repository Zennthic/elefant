<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Theme and palette, applied before paint; see theme.js. The colour tokens
       come from appearance.css (generated), the foundation rules from
       elefant-ui.css — both before this page's own <style>, which refines them. -->
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/appearance.css">
  <link rel="stylesheet" href="/elefant-ui.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="elefant_transparent.png" type="image/png">
  <title>Set up MFA — <!-- APP_NAME --></title>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family: var(--font-sans); background:var(--bg); color:var(--text);
           min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1rem; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius: var(--radius);
            width:100%; max-width:480px; padding:2rem;
      box-shadow: var(--shadow);
    }
    h1 { font-size: 22px; text-align:center; margin-bottom:0.25rem; letter-spacing: -0.02em; }
    .subtitle { text-align:center; color:var(--muted); font-size:0.875rem; margin-bottom:1.25rem; }
    .username { text-align:center; color:var(--muted); font-size:0.8125rem; margin-bottom:1rem;
                font-family:ui-monospace,monospace; }
    /* Literal white, not a token: a QR code needs a light quiet zone to scan,
       whatever the theme. (Allow-listed in test_ui_palettes.py.) */
    .qr { background:#fff; border-radius:var(--radius-sm); padding:1rem; margin:0 auto 1rem; width:fit-content; }
    .qr svg { width:200px; height:200px; display:block; }
    .setup-key { font-family:ui-monospace,monospace; font-size:0.875rem; color:var(--muted);
                 padding:0.5rem 0.75rem; background:var(--field); border-radius:var(--radius-xs);
                 word-break:break-all; text-align:center; margin-bottom:1.25rem;
                 border:1px solid var(--accentline); }
    label { display:block; font-size:0.875rem; color:var(--muted); margin-bottom:0.375rem; }
    input[type="text"] { width:100%; padding:0.5rem 0.75rem; border: 1px solid var(--line);
                        border-radius:var(--radius-sm); background:var(--field); color:var(--text);
                        font-size:1.25rem; font-family:ui-monospace,monospace; letter-spacing:0.5em;
                        text-align:center; outline:none; }
    input:focus { border-color:var(--accent); box-shadow: 0 0 0 3px var(--accentbg); }
    .btn { width:100%; padding:0.625rem 1rem; background:var(--accent); color:var(--on-accent); border:none;
           border-radius:var(--radius-sm); font-weight: 550; cursor:pointer; margin-top:0.75rem; }
    .btn:hover { background:var(--accent-hover); }
    .help { font-size:0.8125rem; color:var(--muted); margin-bottom:0.75rem; }
    .skip { margin-top:1.25rem; padding-top:1rem; border-top:1px solid var(--line); text-align:center; }
    .skip p { font-size:0.8125rem; color:var(--muted); margin-bottom:0.25rem; }
    .btn-link { background:none; border:none; color:var(--accent); font-size:0.875rem;
                font-weight:550; cursor:pointer; padding:0.375rem 0.75rem; }
    .btn-link:hover { text-decoration:underline; }
  </style>
</head>
<body>
<div class="card">
  <h1>Set up two-factor authentication</h1>
  <p class="subtitle">Scan with your authenticator app</p>
  <p class="username"><!-- USERNAME --></p>
  <div class="qr"><!-- QR_SVG --></div>
  <p class="help">Or enter this setup key manually:</p>
  <div class="setup-key"><!-- SETUP_KEY --></div>
  <form method="POST" action="/setup-mfa">
    <input type="hidden" name="next" value="<!-- NEXT -->">
    <label for="code">Confirm with a 6-digit code</label>
    <input type="text" id="code" name="code" inputmode="numeric" pattern="[0-9]*"
           maxlength="6" autocomplete="one-time-code" autofocus required>
    <button type="submit" class="btn">Activate</button>
  </form>
  <form class="skip" method="POST" action="/setup-mfa/skip" <!-- SKIP_HIDDEN -->>
    <input type="hidden" name="next" value="<!-- NEXT -->">
    <p>Two-factor authentication is optional for your organization.
       You can set it up later from your profile.</p>
    <button type="submit" class="btn-link">Skip for now</button>
  </form>
</div>
</body>
</html>
