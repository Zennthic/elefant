# Runs as the unprivileged nginx user (UID 101, nginxinc/nginx-unprivileged),
# so nothing here may need root: the pid file and every temp path live in
# /tmp, and the server listens on 8080 rather than 80.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 500M;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    upstream editor      { server editor:8080;      }
    upstream embedder    { server embedder:8001;     }
    upstream memory-api  { server memory-api:8002;   }
    upstream mcp         { server mcp:8003;          }
    upstream memory_ui   { server memory-ui:8080;    }

    # The client's own address, not the ingress in front of us. Traefik (or
    # any ingress) reaches nginx from a private address and says who the
    # client was in X-Forwarded-For; without this every limit_req below keys
    # on the ingress, and X-Real-IP tells the editor nothing. Only private and
    # loopback peers are believed, and real_ip_recursive takes the right-most
    # address that is not one of them, so a client on the internet cannot
    # choose its own. A client on the same private network as nginx can, which
    # lets it dodge a per-address limit but not the per-account one the editor
    # keeps for /login and /mfa.
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    set_real_ip_from  127.0.0.0/8;
    set_real_ip_from  fc00::/7;
    set_real_ip_from  ::1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # A throttled request is "too many requests", not "service unavailable".
    limit_req_status 429;

    # Rate-limit the unauthenticated public-share surface (per client IP).
    limit_req_zone $binary_remote_addr zone=share:10m rate=10r/s;

    # Password and TOTP submissions (SEC-08). Only POSTs count, so loading the
    # form is never refused; the editor keeps its own per-account lockout on
    # top of this, which holds behind any ingress.
    map $request_method $login_limit_key {
        POST    $binary_remote_addr;
        default "";
    }
    limit_req_zone $login_limit_key zone=login:10m rate=10r/m;

    # /mcp, before the bearer is checked: a flood guard only, set well above
    # what many concurrent agent sessions from one address send. Per-token
    # limits are a separate decision (#138) and stay off.
    limit_req_zone $binary_remote_addr zone=mcp:10m rate=50r/s;

    server {
        listen 8080;

        # Traefik terminates TLS upstream and reverse-proxies to us over HTTP.
        # Without this, nginx's auto-generated trailing-slash redirects (e.g.
        # /mcp -> /mcp/) emit absolute URLs with the wrong scheme (http://...)
        # and the wrong port, breaking OAuth-protected resources like /mcp
        # that clients reach via HTTPS through Traefik.
        absolute_redirect off;
        port_in_redirect  off;

        # ── Auth subrequest endpoint ────────────────────────────────────────
        # Called by auth_request on every protected location.
        # internal: only reachable from nginx subrequests, not from clients.
        location = /api/auth/check {
            internal;
            proxy_pass              http://editor/api/auth/check;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        X-Original-URI $request_uri;
            proxy_set_header        Cookie $http_cookie;
            proxy_set_header        Host $host;
        }

        # ── 401 → login redirect ────────────────────────────────────────────
        # Proxy to the editor's /login-redirect so `next` is percent-encoded in
        # Python. nginx can't urlencode a variable, so `/login?next=$request_uri`
        # truncated a multi-param URL at the first `&` — dropping redirect_uri/
        # code_challenge/state on the OAuth /oauth/authorize flow.
        error_page 401 = @login_redirect;
        location @login_redirect {
            # proxy_pass in a named location can't carry a URI part, so set the
            # upstream path via rewrite (the trailing `?` drops the original
            # query args; the endpoint reads the full original URI from the
            # X-Original-URI header, which $request_uri preserves).
            proxy_set_header   X-Original-URI $request_uri;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            rewrite ^ /login-redirect? break;
            proxy_pass         http://editor;
        }

        # Plain-401 variant for bearer-token API consumers (the standalone
        # graph page) where a login redirect would just hand fetch() the
        # login HTML with a 200 status.
        location @bearer_401 {
            default_type application/json;
            return 401 '{"detail":"Invalid or expired token"}';
        }

        # Plain-403 for a bearer token that is valid but lacks the scope the
        # route needs (the board stream's board_read). Without it nginx answers
        # with its own HTML error page.
        location @bearer_403 {
            default_type application/json;
            return 403 '{"detail":"Token lacks the scope this route needs"}';
        }

        # ── Always-public locations (no auth_request) ───────────────────────

        # Login / logout / first-run setup / MFA / invite onboarding /
        # forced password change. These all handle their own session-cookie
        # redirect to /login when unauthenticated, so they bypass the global
        # auth_request.
        location ~ ^/(login|mfa)$ {
            limit_req          zone=login burst=10 nodelay;
            client_max_body_size 64k;
            proxy_pass         http://editor;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        }
        location ~ ^/(login|logout|setup|setup-mfa|setup-org|mfa|invite|profile|change-password) {
            proxy_pass         http://editor;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # OIDC/SAML callbacks — external IdP posts here, no session cookie
        location /auth/ {
            proxy_pass         http://editor/auth/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            client_max_body_size 1m;
        }

        # ── Public wiki sharing (no auth_request) ───────────────────────────
        # Opaque-token read-only access to a shared page/folder. The editor
        # resolves the tenant + path from the token server-side, so these
        # endpoints never trust a caller and stay scoped to the shared subtree.
        location /api/public/ {
            limit_req          zone=share burst=20 nodelay;
            proxy_pass         http://editor;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            # This is a public surface — never let a client inject identity.
            proxy_set_header   X-Auth-User       "";
            proxy_set_header   X-Auth-User-Id    "";
            proxy_set_header   X-Auth-Org-Id     "";
            proxy_set_header   X-Auth-Org-Slug   "";
            proxy_set_header   X-Auth-Role       "";
            proxy_set_header   X-Auth-Owner-Name "";
            add_header         X-Robots-Tag "noindex, nofollow" always;
        }

        # Public share viewer shell — /share/<token> serves the static page,
        # which reads the token from its own URL and calls /api/public/... .
        location /share/ {
            limit_req          zone=share burst=20 nodelay;
            # Serve the viewer for any /share/<token>. A prefix proxy_pass with
            # a file URI would append the token to the filename, so rewrite the
            # whole path to the fixed file first (the token is read client-side
            # from the address bar, not the request path).
            rewrite            ^/share/.*$ /share.html break;
            proxy_pass         http://memory_ui;
            proxy_set_header   Host $host;
            add_header         X-Robots-Tag "noindex, nofollow" always;
        }

        # Static assets the public share viewer needs, reachable without a
        # session (they're just a JS library and the logo — no data).
        location = /marked.min.js {
            proxy_pass         http://memory_ui/marked.min.js;
            proxy_set_header   Host $host;
        }
        location = /elefant_transparent.png {
            proxy_pass         http://memory_ui/elefant_transparent.png;
            proxy_set_header   Host $host;
        }
        # Draws ```mermaid blocks on a shared page; also just a library.
        location = /mermaid-view.js {
            proxy_pass         http://memory_ui/mermaid-view.js;
            proxy_set_header   Host $host;
        }
        location = /mermaid.min.js {
            proxy_pass         http://memory_ui/mermaid.min.js;
            proxy_set_header   Host $host;
        }

        # The shared theme assets, reachable without a session. EVERY page
        # loads them — including the ones a logged-out visitor sees: /login,
        # /setup, a /share/<token> viewer, the /graph embed. Behind the
        # catch-all's auth_request those visitors would get a login redirect
        # instead of the stylesheet, and since no page carries a palette of
        # its own any more, the page would render with no colours at all.
        # They are the design system and nothing else — no data. Pages load
        # them by absolute path so the URL depth of a page (/editor/…,
        # /platform/admin) can never make one miss.
        location = /theme.js {
            proxy_pass         http://memory_ui/theme.js;
            proxy_set_header   Host $host;
        }
        location = /appearance.css {
            proxy_pass         http://memory_ui/appearance.css;
            proxy_set_header   Host $host;
        }
        location = /elefant-ui.css {
            proxy_pass         http://memory_ui/elefant-ui.css;
            proxy_set_header   Host $host;
        }
        location = /palettes.json {
            proxy_pass         http://memory_ui/palettes.json;
            proxy_set_header   Host $host;
        }

        # RFC 9728: protected resource metadata — served by MCP
        # Both the path-less form and the path-aware form (with /mcp suffix)
        # need to reach the MCP service. Claude.ai requests the path-aware
        # form because the resource URL is https://host/mcp (has a path).
        location = /.well-known/oauth-protected-resource {
            proxy_pass         http://mcp/.well-known/oauth-protected-resource;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        }
        location = /.well-known/oauth-protected-resource/mcp {
            proxy_pass         http://mcp/.well-known/oauth-protected-resource/mcp;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # RFC 8414: AS metadata and other well-known paths — served by editor
        location /.well-known/ {
            proxy_pass         http://editor/.well-known/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # OAuth machine-to-machine endpoints — MCP clients call these without a
        # browser session; exact matches take precedence over /editor/ prefix block
        location = /editor/oauth/token {
            proxy_pass         http://editor/oauth/token;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        }
        location = /editor/oauth/register {
            proxy_pass         http://editor/oauth/register;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }
        location = /editor/oauth/revoke {
            proxy_pass         http://editor/oauth/revoke;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
        }

        # MCP Server — uses OAuth Bearer tokens, not session cookies.
        # The exact-match `= /mcp` block handles the resource URL Claude.ai
        # uses (no trailing slash) without forcing a 301 trailing-slash
        # redirect, which would lose POST bodies and confuse OAuth clients.
        # NOTE: proxy_pass uses no trailing slash so the /mcp prefix is
        # preserved when forwarding — FastMCP's default streamable_http_path
        # is /mcp, so stripping the prefix would 404.
        location = /mcp {
            limit_req          zone=mcp burst=500 nodelay;
            client_max_body_size 10m;
            proxy_pass         http://mcp;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Accept "application/json, text/event-stream";
            proxy_set_header   Connection "";
            proxy_http_version 1.1;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
        location /mcp/ {
            limit_req          zone=mcp burst=500 nodelay;
            client_max_body_size 10m;
            proxy_pass         http://mcp;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   Accept "application/json, text/event-stream";
            proxy_set_header   Connection "";
            proxy_http_version 1.1;
            proxy_buffering    off;
            proxy_cache        off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Protected locations (require valid session cookie) ───────────────

        # Platform admin console (SaaS tier only; editor enforces the role check).
        # Page itself isn't behind auth_request because /platform/admin uses
        # its own session-cookie redirect to /login when unauthenticated.
        location = /platform/admin {
            proxy_pass         http://editor/platform/admin;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
        }
        location /api/platform/ {
            auth_request       /api/auth/check;
            auth_request_set   $auth_user     $upstream_http_x_auth_user;
            auth_request_set   $auth_user_id  $upstream_http_x_auth_user_id;
            auth_request_set   $auth_org_id   $upstream_http_x_auth_org_id;
            auth_request_set   $auth_role     $upstream_http_x_auth_role;
            error_page 401 = @login_redirect;
            proxy_pass         http://editor/api/platform/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Auth-User    $auth_user;
            proxy_set_header   X-Auth-User-Id $auth_user_id;
            proxy_set_header   X-Auth-Org-Id  $auth_org_id;
            proxy_set_header   X-Auth-Role    $auth_role;
        }

        # WYSIWYG Editor UI + all editor routes (including /editor/oauth/authorize)
        location /editor/ {
            auth_request       /api/auth/check;
            auth_request_set   $auth_user     $upstream_http_x_auth_user;
            auth_request_set   $auth_user_id  $upstream_http_x_auth_user_id;
            auth_request_set   $auth_org_id   $upstream_http_x_auth_org_id;
            auth_request_set   $auth_role     $upstream_http_x_auth_role;
            error_page 401 = @login_redirect;

            proxy_pass         http://editor/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header   X-Auth-User    $auth_user;
            proxy_set_header   X-Auth-User-Id $auth_user_id;
            proxy_set_header   X-Auth-Org-Id  $auth_org_id;
            proxy_set_header   X-Auth-Role    $auth_role;
        }

        # Editor file/tree/mkdir API
        location /api/file {
            auth_request       /api/auth/check;
            auth_request_set   $auth_user     $upstream_http_x_auth_user;
            auth_request_set   $auth_user_id  $upstream_http_x_auth_user_id;
            auth_request_set   $auth_org_id   $upstream_http_x_auth_org_id;
            auth_request_set   $auth_role     $upstream_http_x_auth_role;
            error_page 401 = @login_redirect;
            proxy_pass         http://editor/api/file;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Auth-User    $auth_user;
            proxy_set_header   X-Auth-User-Id $auth_user_id;
            proxy_set_header   X-Auth-Org-Id  $auth_org_id;
            proxy_set_header   X-Auth-Role    $auth_role;
        }
        location /api/tree {
            auth_request       /api/auth/check;
            auth_request_set   $auth_user     $upstream_http_x_auth_user;
            auth_request_set   $auth_user_id  $upstream_http_x_auth_user_id;
            auth_request_set   $auth_org_id   $upstream_http_x_auth_org_id;
            auth_request_set   $auth_role     $upstream_http_x_auth_role;
            error_page 401 = @login_redirect;
            proxy_pass         http://editor/api/tree;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Auth-User    $auth_user;
            proxy_set_header   X-Auth-User-Id $auth_user_id;
            proxy_set_header   X-Auth-Org-Id  $auth_org_id;
            proxy_set_header   X-Auth-Role    $auth_role;
        }
        location /api/mkdir {
            auth_request       /api/auth/check;
            auth_request_set   $auth_user     $upstream_http_x_auth_user;
            auth_request_set   $auth_user_id  $upstream_http_x_auth_user_id;
            auth_request_set   $auth_org_id   $upstream_http_x_auth_org_id;
            auth_request_set   $auth_role     $upstream_http_x_auth_role;
            error_page 401 = @login_redirect;
            proxy_pass         http://editor/api/mkdir;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Auth-User    $auth_user;
            proxy_set_header   X-Auth-User-Id $auth_user_id;
            proxy_set_header   X-Auth-Org-Id  $auth_org_id;
            proxy_set_header   X-Auth-Role    $auth_role;
        }

        # User self-service API (profile, password, MFA, tokens, OAuth sessions)
        location /api/me {
            auth_request       /api/auth/check;
            auth_request_set   $auth_user     $upstream_http_x_auth_user;
            auth_request_set   $auth_user_id  $upstream_http_x_auth_user_id;
            auth_request_set   $auth_org_id   $upstream_http_x_auth_org_id;
            auth_request_set   $auth_role     $upstream_http_x_auth_role;
            error_page 401 = @login_redirect;
            proxy_pass         http://editor/api/me;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Auth-User    $auth_user;
            proxy_set_header   X-Auth-User-Id $auth_user_id;
            proxy_set_header   X-Auth-Org-Id  $auth_org_id;
            proxy_set_header   X-Auth-Role    $auth_role;
        }
        location /api/me/ {
            auth_request       /api/auth/check;
            auth_request_set   $auth_user     $upstream_http_x_auth_user;
            auth_request_set   $auth_user_id  $upstream_http_x_auth_user_id;
            auth_request_set   $auth_org_id   $upstream_http_x_auth_org_id;
            auth_request_set   $auth_role     $upstream_http_x_auth_role;
            error_page 401 = @login_redirect;
            proxy_pass         http://editor/api/me/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Auth-User    $auth_user;
            proxy_set_header   X-Auth-User-Id $auth_user_id;
            proxy_set_header   X-Auth-Org-Id  $auth_org_id;
            proxy_set_header   X-Auth-Role    $auth_role;
        }
        location /api/notifications {
            auth_request       /api/auth/check;
            auth_request_set   $auth_user     $upstream_http_x_auth_user;
            auth_request_set   $auth_user_id  $upstream_http_x_auth_user_id;
            auth_request_set   $auth_org_id   $upstream_http_x_auth_org_id;
            auth_request_set   $auth_role     $upstream_http_x_auth_role;
            error_page 401 = @login_redirect;
            proxy_pass         http://editor/api/notifications;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Auth-User    $auth_user;
            proxy_set_header   X-Auth-User-Id $auth_user_id;
            proxy_set_header   X-Auth-Org-Id  $auth_org_id;
            proxy_set_header   X-Auth-Role    $auth_role;
        }
        location /api/notifications/ {
            auth_request       /api/auth/check;
            auth_request_set   $auth_user     $upstream_http_x_auth_user;
            auth_request_set   $auth_user_id  $upstream_http_x_auth_user_id;
            auth_request_set   $auth_org_id   $upstream_http_x_auth_org_id;
            auth_request_set   $auth_role     $upstream_http_x_auth_role;
            error_page 401 = @login_redirect;
            proxy_pass         http://editor/api/notifications/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Auth-User    $auth_user;
            proxy_set_header   X-Auth-User-Id $auth_user_id;
            proxy_set_header   X-Auth-Org-Id  $auth_org_id;
            proxy_set_header   X-Auth-Role    $auth_role;
        }
        location /api/org {
            auth_request       /api/auth/check;
            auth_request_set   $auth_user     $upstream_http_x_auth_user;
            auth_request_set   $auth_user_id  $upstream_http_x_auth_user_id;
            auth_request_set   $auth_org_id   $upstream_http_x_auth_org_id;
            auth_request_set   $auth_role     $upstream_http_x_auth_role;
            error_page 401 = @login_redirect;
            proxy_pass         http://editor/api/org;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Auth-User    $auth_user;
            proxy_set_header   X-Auth-User-Id $auth_user_id;
            proxy_set_header   X-Auth-Org-Id  $auth_org_id;
            proxy_set_header   X-Auth-Role    $auth_role;
        }

        # Admin Config API
        location /api/admin/ {
            auth_request       /api/auth/check;
            auth_request_set   $auth_user     $upstream_http_x_auth_user;
            auth_request_set   $auth_user_id  $upstream_http_x_auth_user_id;
            auth_request_set   $auth_org_id   $upstream_http_x_auth_org_id;
            auth_request_set   $auth_role     $upstream_http_x_auth_role;
            error_page 401 = @login_redirect;
            proxy_pass         http://editor/api/admin/;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Auth-User    $auth_user;
            proxy_set_header   X-Auth-User-Id $auth_user_id;
            proxy_set_header   X-Auth-Org-Id  $auth_org_id;
            proxy_set_header   X-Auth-Role    $auth_role;
        }

        # Board live stream (Server-Sent Events). Same auth as the rest of the
        # boards API, but it must NOT be buffered: nginx's default response
        # buffering holds each event until a buffer fills, which turns a live
        # board into a board that updates in batches minutes apart. An exact-match
        # location so it wins over the /api/board/ prefix below without the two
        # having to be kept in order.
        location = /api/board/stream {
            auth_request       /api/auth/check;
            auth_request_set   $auth_user     $upstream_http_x_auth_user;
            auth_request_set   $auth_user_id  $upstream_http_x_auth_user_id;
            auth_request_set   $auth_org_id   $upstream_http_x_auth_org_id;
            auth_request_set   $auth_role     $upstream_http_x_auth_role;
            # A plain 401, not the login redirect: EventSource follows redirects
            # and would hand the board the login page as if it were a stream.
            # A 401 fires its onerror, which is what the fallback listens for.
            # An API token may open the stream too (board_read, own tenant
            # only); /api/auth/check lets it through for this exact path.
            error_page 401 = @bearer_401;
            error_page 403 = @bearer_403;
            proxy_pass         http://editor/api/board/stream;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_buffering    off;
            proxy_cache        off;
            # Longer than the stream's own idle timeout, so the editor decides
            # when a quiet stream has died rather than nginx cutting it short.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Auth-User    $auth_user;
            proxy_set_header   X-Auth-User-Id $auth_user_id;
            proxy_set_header   X-Auth-Org-Id  $auth_org_id;
            proxy_set_header   X-Auth-Role    $auth_role;
        }

