# Reference a pull secret that already exists in the namespace. Create it
# yourself (`kubectl create secret docker-registry registry-pull ...`), or let
# a secret replicator push it in. Do not also ship it from this overlay: a
# replicator in pull mode replaces its good copy with yours, and every pull
# then fails as an "anonymous token" 401.
- op: add
  path: /spec/template/spec/imagePullSecrets
  value:
    - name: registry-pull
