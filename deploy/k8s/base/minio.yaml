# The bundled S3-compatible store, holding per-org wiki content.
#
# To use managed S3 / R2 / B2 instead: override ELEFANT_S3_ENDPOINT_URL and
# ELEFANT_S3_REGION in the ConfigMap, put that provider's keys in
# elefant-secrets, and drop this file from `resources` in your own overlay.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      enableServiceLinks: false
      containers:
        - name: minio
          # Same image as docker-compose.yml, which says why it is not MinIO's own.
          image: docker.io/pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
          args: [server, /data, --console-address, ":9001"]
          ports:
            - name: s3
              containerPort: 9000
            - name: console
              containerPort: 9001
          env:
            # MinIO's root credentials are the same pair the app authenticates
            # to S3 with, which is why they live in elefant-secrets rather than
            # the ConfigMap.
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: elefant-secrets
                  key: ELEFANT_S3_ACCESS_KEY
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: elefant-secrets
                  key: ELEFANT_S3_SECRET_KEY
          volumeMounts:
            - name: minio-data
              mountPath: /data
          livenessProbe:
            httpGet: {path: /minio/health/live, port: s3}
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 6
          readinessProbe:
            httpGet: {path: /minio/health/live, port: s3}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests: {cpu: 50m,  memory: 128Mi}
            limits:   {cpu: 500m, memory: 512Mi}
      volumes:
        - name: minio-data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  type: ClusterIP
  selector:
    app: minio
  ports:
    - name: s3
      port: 9000
      targetPort: s3
    - name: console
      port: 9001
      targetPort: console
