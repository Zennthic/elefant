apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
    spec:
      enableServiceLinks: false
      containers:
        - name: qdrant
          # Pinned, like the Compose stack. An unpinned tag lets an upstream
          # release move the vector store between two deploys.
          image: qdrant/qdrant:v1.19.1
          ports:
            - name: http
              containerPort: 6333
            - name: grpc
              containerPort: 6334
          volumeMounts:
            - name: qdrant-data
              mountPath: /qdrant/storage
          # TCP rather than httpGet, matching the Compose stack's decision to
          # ship no healthcheck at all: the qdrant image carries no wget, curl
          # or other HTTP client, and an exec probe would fail on the missing
          # binary rather than on the service. A TCP probe needs nothing in the
          # image. Its dependents retry their connections, so nothing gates on
          # qdrant being Ready.
          livenessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 6
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits:   {cpu: "1",  memory: 1Gi}
      volumes:
        - name: qdrant-data
          persistentVolumeClaim:
            claimName: qdrant-data
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  type: ClusterIP
  selector:
    app: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
    - name: grpc
      port: 6334
      targetPort: grpc
