<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Theme and palette, applied before paint; see theme.js. A share viewer
       is usually NOT logged in, which is why these three are served
       without a session (see nginx.conf) — the page has no palette of its own. -->
  <script src="/theme.js"></script>
  <link rel="stylesheet" href="/appearance.css">
  <link rel="stylesheet" href="/elefant-ui.css">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/elefant_transparent.png" type="image/png">
  <title>Shared · Elefant</title>
  <script src="/marked.min.js"></script>
  <script src="/mermaid-view.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg); color: var(--text);
      display: flex; flex-direction: column; min-height: 100%;
    }
    header {
      background: var(--panel); border-bottom: 1px solid var(--line);
      display: flex; align-items: center; gap: 14px;
      padding: 12px 20px; flex-wrap: wrap;
    }
    .logo { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.04em; color: var(--accent2); white-space: nowrap; }
    .logo span { color: var(--text); font-weight: 400; }
    .share-title { font-size: 0.9rem; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .share-badge {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
      color: var(--accent2); border: 1px solid var(--accent2line); background: var(--accent2bg);
      padding: 2px 8px; border-radius: 999px; white-space: nowrap;
    }
    .page-picker { margin-left: auto; }
    .page-picker select {
      background: var(--bg); color: var(--text); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 6px 10px; font-size: 0.85rem; max-width: 60vw;
    }
    main { flex: 1; min-width: 0; overflow-y: auto; padding: 32px 20px; }
    .wrap { max-width: 820px; margin: 0 auto; min-width: 0; }
    .state { text-align: center; color: var(--muted); padding: 64px 20px; font-size: 0.95rem; }
    .state.error { color: var(--danger); }
    footer { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 18px; border-top: 1px solid var(--line); }
    footer a { color: var(--muted); }

    /* Markdown typography — mirrors the in-app wiki viewer (incl. #84 fixes). */
    .md-body { font-size: 0.98rem; line-height: 1.75; color: var(--text); overflow-wrap: break-word; min-width: 0; }
    .md-body h1,.md-body h2,.md-body h3,.md-body h4,.md-body h5,.md-body h6 { font-weight: 700; line-height: 1.3; margin: 1.5em 0 0.5em; }
    .md-body h1 { font-size: 2rem; border-bottom: 2px solid var(--line); padding-bottom: 0.4em; margin-top: 0; }
    .md-body h2 { font-size: 1.5rem; border-bottom: 1px solid var(--line); padding-bottom: 0.3em; }
    .md-body h3 { font-size: 1.2rem; }
    .md-body p { margin: 0.8em 0; }
    .md-body ul,.md-body ol { margin: 0.6em 0; padding-left: 1.8em; }
    .md-body li { margin: 0.3em 0; }
    .md-body a { color: var(--accent); text-decoration: none; }
    .md-body a:hover { text-decoration: underline; }
    .md-body img { max-width: 100%; border-radius: var(--radius); }
    .md-body code { background: var(--raised); padding: 0.15em 0.4em; border-radius: var(--radius-xs); font-size: 0.88em; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; color: var(--danger); }
    .md-body pre { background: var(--raised); color: var(--text); padding: 16px 20px; border-radius: var(--radius); font-size: 0.85rem; line-height: 1.65; overflow-x: auto; white-space: pre; margin: 1em 0; }
    .md-body pre code { background: none; padding: 0; color: inherit; font-size: inherit; }
    .md-body .mermaid-diagram { margin: 1em 0; overflow-x: auto; text-align: center; }
    .md-body .mermaid-diagram svg { max-width: 100%; height: auto; }
    .md-body .mermaid-source { text-align: left; margin-top: 4px; font-size: 0.8rem; }
    .md-body .mermaid-source summary { cursor: pointer; }
    .md-body .mermaid-error-msg { text-align: left; color: var(--danger); font-size: 0.85rem; }
    .md-body blockquote { border-left: 4px solid var(--accent); background: var(--accentbg); margin: 1em 0; padding: 0.5em 1em; color: var(--text); border-radius: 0 var(--radius) var(--radius) 0; }
    .md-table-wrap { overflow-x: auto; max-width: 100%; margin: 1em 0; }
    .md-body table { border-collapse: collapse; width: auto; min-width: 100%; margin: 0; font-size: 0.88rem; }
    .md-body th,.md-body td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
    .md-body th { background: var(--raised); color: var(--text); font-weight: 600; }
    .md-body hr { border: none; border-top: 2px solid var(--line); margin: 2em 0; }
    .md-body strong { font-weight: 700; }
    @media (max-width: 768px) { main { padding: 20px 14px; } }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">Elefant<span> · shared</span></a>
    <span class="share-badge">Read-only</span>
    <span class="share-title" id="share-title"></span>
    <div class="page-picker" id="page-picker" style="display:none;">
      <select id="page-select" onchange="loadPage(this.value)"></select>
    </div>
  </header>
  <main>
    <div class="wrap">
      <div id="view"><div class="state">Loading…</div></div>
    </div>
  </main>
  <footer>Shared via <a href="/">Elefant</a> · anyone with this link can view</footer>

  <script>
    'use strict';
    // Token is the segment after /share/ in the path.
    const TOKEN = (location.pathname.replace(/^\/share\//, '').split('/')[0] || '').trim();
    const API = '/api/public/share/' + encodeURIComponent(TOKEN);
    const viewEl = document.getElementById('view');

    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function stateError(msg) { viewEl.innerHTML = '<div class="state error">' + esc(msg) + '</div>'; }

    // Wrap tables so they scroll on mobile instead of overflowing (issue #84).
    function wrapTables(html) {
      return html.replace(/<table\b[^>]*>[\s\S]*?<\/table>/gi, (t) => '<div class="md-table-wrap">' + t + '</div>');
    }

    // Resolve relative <img src> against the page's directory, pointing at the
    // public image endpoint (which is scoped to the shared subtree).
    function resolveImages(html, pagePath) {
      const dir = pagePath.includes('/') ? pagePath.split('/').slice(0, -1) : [];
      return html.replace(/(<img\b[^>]*?\ssrc=")([^"#?]+)(")/gi, (m, pre, src, post) => {
        if (/^https?:\/\/|^\/|^data:/i.test(src)) return m; // already absolute
        const parts = [...dir, ...src.split('/')];
        const out = [];
        for (const p of parts) { if (p === '..') out.pop(); else if (p && p !== '.') out.push(p); }
        return pre + API + '/image?path=' + encodeURIComponent(out.join('/')) + post;
      });
    }

    async function loadPage(path) {
      viewEl.innerHTML = '<div class="state">Loading…</div>';
      try {
        const r = await fetch(API + '/file?path=' + encodeURIComponent(path));
        if (!r.ok) throw new Error('This page is unavailable.');
        const data = await r.json();
        const body = (data.content || '').replace(/^---[\s\S]*?---\n?/, ''); // strip frontmatter
        viewEl.innerHTML = '<div class="md-body">' + wrapTables(resolveImages(marked.parse(body), data.path)) + '</div>';
        if (window.renderMermaidBlocks) renderMermaidBlocks(viewEl.querySelector('.md-body'));
        window.scrollTo(0, 0);
        const sel = document.getElementById('page-select');
        if (sel) sel.value = path;
      } catch (e) {
        stateError(e.message || 'Failed to load this page.');
      }
    }

    (async function init() {
      if (!TOKEN) { stateError('Invalid share link.'); return; }
      try {
        const r = await fetch(API);
        if (r.status === 404) { stateError('This share link is invalid or has expired.'); return; }
        if (!r.ok) throw new Error('Unable to open this share.');
        const meta = await r.json();
        document.getElementById('share-title').textContent =
          (meta.org_name ? meta.org_name + ' · ' : '') + (meta.title || 'Shared');
        document.title = (meta.title || 'Shared') + ' · Elefant';
        const pages = meta.pages || [];
        if (pages.length > 1) {
          const picker = document.getElementById('page-picker');
          const sel = document.getElementById('page-select');
          sel.innerHTML = pages.map(p => '<option value="' + esc(p.path) + '">' + esc(p.title) + '</option>').join('');
          picker.style.display = '';
        }
        if (!pages.length) { stateError('This share has no content.'); return; }
        loadPage(pages[0].path);
      } catch (e) {
        stateError(e.message || 'Unable to open this share.');
      }
    })();
  </script>
</body>
</html>
