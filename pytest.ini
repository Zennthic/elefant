[pytest]
# Each service has its own main.py at <service>/main.py.  Python's import
# system imports each module once per process, so a single `pytest`
# invocation that crosses two services tries to register two different
# "main" modules and the second one collides on the first.
#
# To avoid that we run pytest PER SERVICE in CI (the test_<service> jobs
# in build-deploy.yml).  pytest.ini stays mostly empty — `testpaths` is
# intentionally NOT set globally; each per-service invocation passes the
# path on the command line.  The cross-service tests/ directory (smoke +
# property-based) is run as its own job that doesn't import any service.

asyncio_mode = auto

python_files = test_*.py
python_functions = test_*

addopts = -ra --tb=short --strict-markers

markers =
    integration: tests that need a running Postgres / Qdrant / MinIO
    smoke: cross-service smoke checks that run post-deploy
    slow: needs a heavy optional dependency or a model download; skips without it
